spring.application.name=sinova-api

# Conexion a la base de datos del proyecto SINOVA
spring.datasource.url=jdbc:mysql://localhost:3306/sinova?serverTimezone=America/Bogota
spring.datasource.username=root
# La clave va en db-local.properties (no se sube a GitHub)
spring.config.import=optional:classpath:db-local.properties

# Las tablas ya existen (script de la GA6), Hibernate no las modifica
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

server.port=8080
